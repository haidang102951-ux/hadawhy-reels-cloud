name: Deploy Telegram Bot Webhook on Modal

on:
  workflow_dispatch:

jobs:
  deploy_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Modal Secrets & Deploy Webhook
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python -m pip install -q modal
          modal secret create hadawhy-secrets --force \
            "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" \
            "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" \
            "GEMINI_API_KEY=$GEMINI_API_KEY" \
            "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" \
            "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" \
            "SERPER_API_KEY=$SERPER_API_KEY" \
            "GH_MODELS_TOKEN=$GH_MODELS_TOKEN" \
            "GH_PAT=$GH_PAT"

          DEPLOY_LOG=$(modal deploy engine/modal_worker.py 2>&1)
          echo "$DEPLOY_LOG"

          WEBHOOK_URL=$(python -c '
          import re, sys
          log = sys.stdin.read()
          m = re.search(r"https://[^\s]+telegram-webhook[^\s]*\.modal\.run", log)
          print(m.group(0) if m else "")
          ' <<< "$DEPLOY_LOG")

          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Could not extract telegram-webhook URL from modal deploy output"
            exit 1
          fi

          echo "Registering Telegram Webhook: $WEBHOOK_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -d "url=${WEBHOOK_URL}"
          echo ""
